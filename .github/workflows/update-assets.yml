
name: Update WordPress.org Assets

on:
  push:
    branches:
      - master
    paths:
      - '.wordpress-org/**'

  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WordPress.org README
        run: |
          if [ ! -f README.txt ]; then
            svn cat \
              https://plugins.svn.wordpress.org/libro-de-reclamaciones-y-quejas/trunk/README.txt \
              > README.txt
          fi

          test -s README.txt
          echo "README preparado correctamente"

      - name: Update WordPress.org assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: libro-de-reclamaciones-y-quejas
          ASSETS_DIR: .wordpress-org
          README_NAME: README.txt
          IGNORE_OTHER_FILES: true
